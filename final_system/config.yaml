project:
  name: "Turkish Legal RAG Final System"

models:
  embedding_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  base_llm: "mistralai/Mistral-7B-Instruct-v0.2"

  finetuned_adapter: ""
  local_finetuned_adapter: ""

retrieval:
  chunk_size: 1200
  chunk_overlap: 200
  top_k: 5
  candidate_k: 20
  hybrid_alpha: 0.65

generation:
  max_input_length: 2048
  max_new_tokens: 220
  temperature: 0.0
  do_sample: false

paths:
  documents_dir: "data/custom_documents"
  benchmark_path: "data/custom_benchmark/sample_benchmark.csv"
  outputs_dir: "data/outputs"